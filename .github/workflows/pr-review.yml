name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  container_changes:
    name: Check container inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Check out the PR and its history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect container changes in the full PR diff
        id: filter
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" -- \
            Dockerfile '*.Dockerfile' .dockerignore \
            Cargo.toml Cargo.lock rust-toolchain rust-toolchain.toml .cargo/ \
            .github/workflows/ tests/container.sh \
            > "$RUNNER_TEMP/container-changes.txt"
          if [[ -s "$RUNNER_TEMP/container-changes.txt" ]]; then
            cat "$RUNNER_TEMP/container-changes.txt"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  container:
    name: Container (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: container_changes
    if: needs.container_changes.outputs.changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the container
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VARIANT=${{ matrix.variant }}
            CARGO_PROFILE=dev
          load: true
          tags: semver-ci:test-${{ matrix.variant }}
          cache-from: type=gha,scope=container-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}
      - name: Test the container runtime and CLI
        run: bash tests/container.sh semver-ci:test-${{ matrix.variant }} ${{ matrix.variant }}
