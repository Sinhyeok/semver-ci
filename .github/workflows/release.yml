on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'

name: Release

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  upcoming_version:
    runs-on: ubuntu-latest
    container: tartar4s/semver-ci:v0.9.4
    needs: [ ci ]
    outputs:
      UPCOMING_VERSION: ${{ steps.set_upcoming_version.outputs.UPCOMING_VERSION }}
    steps:
      - id: set_upcoming_version
        run: |
          export SCOPE=$(svci scope)
          svci version >> "$GITHUB_OUTPUT"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push_to_registry:
    name: Push ${{ matrix.variant }} image to Docker Hub
    runs-on: ubuntu-latest
    needs: [ upcoming_version ]
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, debian]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tartar4s/semver-ci
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.upcoming_version.outputs.UPCOMING_VERSION }}-${{ matrix.variant }}
            type=raw,value=${{ needs.upcoming_version.outputs.UPCOMING_VERSION }},enable=${{ matrix.variant == 'alpine' }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VARIANT=${{ matrix.variant }}
            CARGO_PROFILE=dev
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}

      - name: Test the container runtime and CLI
        env:
          IMAGE_TAG: tartar4s/semver-ci:${{ needs.upcoming_version.outputs.UPCOMING_VERSION }}-${{ matrix.variant }}
          VARIANT: ${{ matrix.variant }}
        run: bash tests/container.sh "$IMAGE_TAG" "$VARIANT"

      - name: Push the tested Docker image
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$DOCKER_TAGS"

  release:
    runs-on: ubuntu-latest
    container: tartar4s/semver-ci:v0.9.4
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'hotfix/')
    needs: [ upcoming_version, push_to_registry ]
    permissions:
      contents: write
    steps:
      - run: svci release -g "$RELEASE_NAME"
    env:
      RELEASE_NAME: ${{needs.upcoming_version.outputs.UPCOMING_VERSION}}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DESCRIPTION: |
        ## Artifacts
        - Alpine (musl): tartar4s/semver-ci:${{needs.upcoming_version.outputs.UPCOMING_VERSION}}-alpine
        - Debian (GNU): tartar4s/semver-ci:${{needs.upcoming_version.outputs.UPCOMING_VERSION}}-debian
        - Default (Alpine): tartar4s/semver-ci:${{needs.upcoming_version.outputs.UPCOMING_VERSION}}
      GENERATE_RELEASE_NOTES: true
